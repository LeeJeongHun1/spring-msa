server:
  port: 8002
  servlet:
    session:
      cookie:
        same-site: none
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: #{clientId}
            client-secret: #{clientSecret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8001/login/oauth2/code/google"
            scope: # 기본 값 openid,profile,email => profile, email 로 설정 변경
              - profile
              - email
          naver:
            client-id: #{clientId}
            client-secret: #{clientSecret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8001/login/oauth2/code/naver"
            client-name: Naver
          kakao:
            client-id: #{clientId}
            client-secret: #{clientSecret}
            client-authentication-method: client_secret_post
            redirect-uri: "http://localhost:8001/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-name: Kakao
            scope:
              - profile_nickname
        provider:
          naver:
            authorization_uri: https://nid.naver.com/oauth2.0/authorize
            token_uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user_name_attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  config:
    activate:
      on-profile: local
  application:
    name: auth-server
  jpa:
    show-sql: true
    generate-ddl: true
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 1000
        show_sql: true
        use_sql_comments: true
        format_sql: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/auth-server
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 5
      minimum-idle: 3
      connection-timeout: 30000
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: html
    encoding: utf-8
    cache: true
    check-template-location: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka

